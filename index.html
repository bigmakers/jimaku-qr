<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>THE・字幕 QR受信</title>
<meta name="description" content="THE・字幕アプリの連続QRコードを読み取ってテキストを復元します。処理はすべてこの端末のブラウザ内で行われ、どこにも送信されません。">
<style>
  :root {
    --bg: #ffffff;
    --text: #111111;
    --sub: #555555;
    --accent: #0a5cc2;
    --card: #f2f2f4;
    --ok: #0a7a33;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #111111;
      --text: #f2f2f2;
      --sub: #aaaaaa;
      --accent: #6fb1ff;
      --card: #1f1f22;
      --ok: #5fd98a;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Hiragino Sans", "BIZ UDGothic", system-ui, sans-serif;
    font-size: 17px;
    line-height: 1.6;
  }
  main { max-width: 640px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 1.3rem; margin: 8px 0 4px; }
  .sub { color: var(--sub); font-size: 0.9rem; margin: 0 0 12px; }
  #videoWrap {
    position: relative;
    background: #000;
    border-radius: 12px;
    overflow: hidden;
    aspect-ratio: 4 / 3;
  }
  video { width: 100%; height: 100%; object-fit: cover; display: block; }
  #progress {
    margin: 12px 0;
    padding: 12px;
    background: var(--card);
    border-radius: 12px;
  }
  #bar { height: 10px; background: var(--bg); border-radius: 5px; overflow: hidden; }
  #barFill { height: 100%; width: 0%; background: var(--accent); transition: width 0.2s; }
  #status { margin-top: 8px; font-variant-numeric: tabular-nums; }
  #result {
    display: none;
    margin-top: 12px;
  }
  #resultText {
    width: 100%;
    min-height: 200px;
    font-size: 17px;
    padding: 12px;
    border-radius: 12px;
    border: 1px solid var(--sub);
    background: var(--card);
    color: var(--text);
    white-space: pre-wrap;
  }
  button {
    font-size: 17px;
    min-height: 48px;
    padding: 0 20px;
    border-radius: 12px;
    border: none;
    background: var(--accent);
    color: #fff;
    margin: 12px 8px 0 0;
    cursor: pointer;
  }
  button.secondary { background: var(--card); color: var(--text); border: 1px solid var(--sub); }
  .ok { color: var(--ok); font-weight: bold; }
  #error { color: #c22; display: none; margin-top: 12px; }
</style>
</head>
<body>
<main>
  <h1>THE・字幕 QR受信</h1>
  <p class="sub">送信側の画面（連続QRコード）をカメラに映し続けてください。読み取りはこの端末の中だけで行われ、テキストはどこにも送信されません。</p>

  <div id="videoWrap"><video id="video" playsinline muted></video></div>

  <div id="progress">
    <div id="bar"><div id="barFill"></div></div>
    <div id="status">カメラを起動しています…</div>
  </div>

  <div id="result">
    <div class="ok">✅ 受信完了</div>
    <textarea id="resultText" readonly></textarea>
    <div>
      <button id="copyBtn">コピー</button>
      <button id="againBtn" class="secondary">もう一度受信する</button>
    </div>
  </div>

  <p id="error"></p>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js"></script>
<script>
(() => {
  const video = document.getElementById("video");
  const status = document.getElementById("status");
  const barFill = document.getElementById("barFill");
  const result = document.getElementById("result");
  const resultText = document.getElementById("resultText");
  const errorEl = document.getElementById("error");

  const canvas = document.createElement("canvas");
  const ctx = canvas.getContext("2d", { willReadFrequently: true });

  // Per-transfer chunk store: id -> { total, chunks: Map(index -> text) }
  let transfers = {};
  let done = false;

  function fail(message) {
    errorEl.textContent = message;
    errorEl.style.display = "block";
    status.textContent = "停止しました";
  }

  function showResult(text) {
    done = true;
    resultText.value = text;
    result.style.display = "block";
    status.textContent = "受信完了";
    barFill.style.width = "100%";
    resultText.scrollIntoView({ behavior: "smooth" });
  }

  function handlePayload(data) {
    if (!data) return;
    if (!data.startsWith("KQR1|")) {
      // Plain single QR from the app (or anything else readable).
      showResult(data);
      return;
    }
    // KQR1|id|index|total|chunk  (chunk may contain "|")
    const first = data.indexOf("|");
    const second = data.indexOf("|", first + 1);
    const third = data.indexOf("|", second + 1);
    const fourth = data.indexOf("|", third + 1);
    if (fourth < 0) return;
    const id = data.slice(first + 1, second);
    const index = parseInt(data.slice(second + 1, third), 10);
    const total = parseInt(data.slice(third + 1, fourth), 10);
    const chunk = data.slice(fourth + 1);
    if (!id || !Number.isFinite(index) || !Number.isFinite(total) ||
        index < 1 || total < 1 || index > total) return;

    if (!transfers[id]) transfers[id] = { total, chunks: new Map() };
    const t = transfers[id];
    t.chunks.set(index, chunk);

    const got = t.chunks.size;
    barFill.style.width = Math.round((got / t.total) * 100) + "%";
    status.textContent = `受信中… ${got} / ${t.total} 枚（そのまま映し続けてください）`;

    if (got >= t.total) {
      const parts = [];
      for (let i = 1; i <= t.total; i++) parts.push(t.chunks.get(i) ?? "");
      showResult(parts.join(""));
    }
  }

  function scanLoop() {
    if (done) return;
    if (video.readyState === video.HAVE_ENOUGH_DATA) {
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      ctx.drawImage(video, 0, 0);
      const image = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const code = jsQR(image.data, image.width, image.height, { inversionAttempts: "dontInvert" });
      if (code && code.data) handlePayload(code.data);
    }
    requestAnimationFrame(scanLoop);
  }

  async function start() {
    done = false;
    transfers = {};
    result.style.display = "none";
    errorEl.style.display = "none";
    barFill.style.width = "0%";
    try {
      const stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: "environment" },
        audio: false
      });
      video.srcObject = stream;
      await video.play();
      status.textContent = "QRコードを探しています…";
      requestAnimationFrame(scanLoop);
    } catch (e) {
      fail("カメラを使用できませんでした。ブラウザのカメラ許可を確認して、ページを再読み込みしてください。");
    }
  }

  document.getElementById("copyBtn").addEventListener("click", async () => {
    try {
      await navigator.clipboard.writeText(resultText.value);
      document.getElementById("copyBtn").textContent = "コピーしました";
    } catch {
      resultText.select();
      document.execCommand("copy");
    }
  });

  document.getElementById("againBtn").addEventListener("click", () => {
    document.getElementById("copyBtn").textContent = "コピー";
    start();
  });

  if (!navigator.mediaDevices || !window.isSecureContext) {
    fail("このブラウザではカメラを使用できません。SafariまたはChromeで開いてください。");
  } else {
    start();
  }
})();
</script>
</body>
</html>
